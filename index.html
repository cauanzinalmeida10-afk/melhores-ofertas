<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://zzlenpjfkynbjnjlnhss.supabase.co";
const SUPABASE_KEY = "sb_publishable_82s4rCQbp7YbrHR5G7ghKg_IFXQHlrM";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const CHAVE_SENHA = "000111";

let produtos = [];
let nomeInstagram = "insta: melhores_achados.da.internet";
let linkInstagram = "https://www.instagram.com/melhores_achados.da.internet/";

function prepararLink(link) {
    link = (link || "").trim();

    if (!link) return "#";

    if (/^(https?:\/\/|mailto:|tel:|#)/i.test(link)) {
        return link;
    }

    return "https://" + link;
}

function mostrarErro(erro) {
    console.error(erro);
    alert(erro.message || "Ocorreu um erro. Tente novamente.");
}

async function carregarProdutos() {
    const { data, error } = await supabase
        .from("produtos")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        mostrarErro(error);
        return;
    }

    produtos = data || [];

    mostrarProdutos(document.getElementById("busca").value);
    atualizarListaAdmin();
}

async function carregarInstagram() {
    const { data, error } = await supabase
        .from("configuracoes")
        .select("*")
        .eq("id", 1)
        .maybeSingle();

    if (error) {
        mostrarErro(error);
        return;
    }

    if (data) {
        nomeInstagram = data.nome_instagram;
        linkInstagram = data.link_instagram;
    }

    atualizarInstagram();
}

function atualizarInstagram() {
    const instagram = document.getElementById("instagramTopo");

    instagram.textContent = nomeInstagram;
    instagram.href = prepararLink(linkInstagram);

    document.getElementById("nomeInstagram").value = nomeInstagram;
    document.getElementById("linkInstagram").value = linkInstagram;
}

async function chamarFuncao(dados) {
    const { data, error } = await supabase.functions.invoke(
        "super-service",
        {
            body: {
                ...dados,
                senha: CHAVE_SENHA
            }
        }
    );

    if (error) {
        throw new Error(data?.erro || error.message);
    }

    if (data?.erro) {
        throw new Error(data.erro);
    }

    return data;
}

async function salvarInstagram() {
    const novoNome = document.getElementById("nomeInstagram").value.trim();
    const novoLink = document.getElementById("linkInstagram").value.trim();

    if (!novoNome || !novoLink) {
        alert("Preencha o nome e o link!");
        return;
    }

    try {
        await chamarFuncao({
            acao: "salvar_instagram",
            nome_instagram: novoNome,
            link_instagram: novoLink
        });

        nomeInstagram = novoNome;
        linkInstagram = novoLink;

        atualizarInstagram();

        alert("Nome e link do topo atualizados!");
    } catch (erro) {
        mostrarErro(erro);
    }
}

function mostrarProdutos(filtro = "") {
    const lista = document.getElementById("listaProdutos");
    lista.innerHTML = "";

    produtos.forEach((produto) => {
        if (!produto.nome.toLowerCase().includes(filtro.toLowerCase())) {
            return;
        }

        const card = document.createElement("article");
        card.className = "produto";

        const imagemLink = document.createElement("a");
        imagemLink.className = "imagem-link";
        imagemLink.href = prepararLink(produto.link);
        imagemLink.target = "_blank";
        imagemLink.rel = "noopener noreferrer";

        const imagem = document.createElement("img");
        imagem.src = produto.imagem;
        imagem.alt = produto.nome;

        imagemLink.appendChild(imagem);

        const info = document.createElement("div");
        info.className = "produto-info";

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "OFERTA";

        const nome = document.createElement("h3");
        nome.textContent = produto.nome;

        const botao = document.createElement("a");
        botao.className = "botao";
        botao.textContent = "CONFERIR";
        botao.href = prepararLink(produto.link);
        botao.target = "_blank";
        botao.rel = "noopener noreferrer";

        info.append(tag, nome, botao);
        card.append(imagemLink, info);
        lista.appendChild(card);
    });
}

function atualizarListaAdmin() {
    const lista = document.getElementById("listaAdmin");
    lista.innerHTML = "";

    produtos.forEach((produto) => {
        const item = document.createElement("div");
        item.className = "item-admin";

        const nome = document.createElement("span");
        nome.textContent = produto.nome;

        const excluir = document.createElement("button");
        excluir.className = "botao-admin";
        excluir.textContent = "EXCLUIR";
        excluir.onclick = () => excluirProduto(produto);

        item.append(nome, excluir);
        lista.appendChild(item);
    });

    if (produtos.length === 0) {
        lista.textContent = "Nenhum produto cadastrado.";
    }
}

async function adicionarProduto() {
    const arquivo = document.getElementById("imagemProduto").files[0];
    const nome = document.getElementById("nomeProduto").value.trim();
    const link = document.getElementById("linkProduto").value.trim();

    if (!arquivo || !nome || !link) {
        alert("Preencha todos os campos e escolha uma imagem!");
        return;
    }

    if (!arquivo.type.startsWith("image/")) {
        alert("Escolha um arquivo de imagem válido.");
        return;
    }

    try {
        const base64 = await new Promise((resolve, reject) => {
            const leitor = new FileReader();

            leitor.onload = () => {
                const resultado = leitor.result;
                resolve(resultado.split(",")[1]);
            };

            leitor.onerror = () => reject(
                new Error("Não foi possível carregar a imagem.")
            );

            leitor.readAsDataURL(arquivo);
        });

        await chamarFuncao({
            acao: "adicionar_produto",
            nome: nome,
            link: link,
            imagem_base64: base64,
            imagem_tipo: arquivo.type,
            imagem_nome: arquivo.name
        });

        document.getElementById("imagemProduto").value = "";
        document.getElementById("nomeProduto").value = "";
        document.getElementById("linkProduto").value = "";

        await carregarProdutos();

        alert("Produto adicionado com sucesso!");

    } catch (erro) {
        mostrarErro(erro);
    }
}

async function excluirProduto(produto) {
    if (!confirm("Deseja excluir este produto?")) {
        return;
    }

    try {
        await chamarFuncao({
            acao: "excluir_produto",
            id: produto.id,
            imagem: produto.imagem
        });

        await carregarProdutos();

    } catch (erro) {
        mostrarErro(erro);
    }
}

async function abrirAdmin() {
    const senha = prompt("Digite a senha do dono:");

    if (senha === null) return;

    try {
        const { data, error } = await supabase.functions.invoke(
            "super-service",
            {
                body: {
                    acao: "verificar_senha",
                    senha: senha
                }
            }
        );

        if (error || !data?.ok) {
            alert(data?.erro || "Senha incorreta!");
            return;
        }

        document.getElementById("admin").style.display = "block";

        atualizarInstagram();
        atualizarListaAdmin();

        document.getElementById("admin").scrollIntoView({
            behavior: "smooth"
        });

    } catch (erro) {
        mostrarErro(erro);
    }
}

function fecharAdmin() {
    document.getElementById("admin").style.display = "none";
}

let cliquesTitulo = 0;
let temporizadorTitulo;

document.getElementById("tituloPrincipal").addEventListener(
    "click",
    contarClique
);

document.getElementById("logo").addEventListener(
    "click",
    contarClique
);

function contarClique() {
    cliquesTitulo++;

    clearTimeout(temporizadorTitulo);

    temporizadorTitulo = setTimeout(() => {
        cliquesTitulo = 0;
    }, 1800);

    if (cliquesTitulo >= 5) {
        cliquesTitulo = 0;
        abrirAdmin();
    }
}

document.getElementById("busca").addEventListener("input", function() {
    mostrarProdutos(this.value);
});

window.salvarInstagram = salvarInstagram;
window.adicionarProduto = adicionarProduto;
window.fecharAdmin = fecharAdmin;

async function iniciarSite() {
    await carregarInstagram();
    await carregarProdutos();

    supabase
        .channel("mudancas-produtos")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "produtos"
            },
            () => carregarProdutos()
        )
        .subscribe();
}

iniciarSite();
</script>
